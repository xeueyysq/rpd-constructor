# Только HTTP внутри Docker. HTTPS завершает nginx на хосте → proxy на 127.0.0.1:8080.
# $http_x_forwarded_proto приходит с хоста, если там выставлен X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# В mime.types образа nginx нет .mjs: воркер pdf.js без JS-типа не загружается как модуль.
types { application/javascript mjs; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(json)$ {
        root /usr/share/nginx/html;
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rpd_upstream server:8000;
        proxy_pass http://$rpd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /auth/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rpd_upstream server:8000;
        proxy_pass http://$rpd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
